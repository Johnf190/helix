<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,interactive-widget=resizes-content">
<meta name="theme-color" content="#07090c">
<title>HELIX</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   WORKING SHELL ONLY. Visual design is ALICE's lane (memory/facts/36).
   Structure is what matters here: entity stack above, chat pinned bottom,
   council bottom-right.
   ───────────────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#07090c;color:#c8d4dd;
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* ── ENTITY STACK (top) ─────────────────────────────────────────────────── */
#stack{flex:0 0 auto;padding:8px 10px 6px;display:flex;flex-direction:column;gap:6px;
       border-bottom:1px solid #16202a;background:#080b0f}
.ent{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
     border:1px solid #16202a;background:#0b1015;transition:border-color .15s,background .15s}
.ent[data-on="1"]{border-color:#2f7d8c;background:#0d151b}
.dot{width:9px;height:9px;border-radius:50%;background:#233240;flex:0 0 auto}
.ent[data-on="1"] .dot{background:#4fd0e3;box-shadow:0 0 8px #4fd0e3}
.ent.alice[data-on="1"] .dot{background:#d98cc4;box-shadow:0 0 8px #d98cc4}
.ent.alice[data-on="1"]{border-color:#8c4f7d}
.enm{font-size:12px;letter-spacing:.14em;text-transform:uppercase;flex:0 0 auto}
/* ONE entity. Helix is the face of the whole system; Odin and Alice are reached
   through the composer's arm button, not by switching who you are talking to. */
#ent{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 2px;
     -webkit-tap-highlight-color:transparent;cursor:pointer}
#orb{display:block;transition:opacity .25s}
#ent[data-muted="1"] #orb{opacity:.32}
#eName{font-size:13px;font-weight:600;letter-spacing:.34em;text-indent:.34em;color:#e8eef4}
#eState{font-size:11px;color:#FF5A36}
#ent[data-muted="1"] #eState{color:#5d7182}
/* the speech envelope: /speak and /ask_stream already send `env` per clip */
#eBars{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:16px;margin-top:2px}
#eBars i{width:2px;border-radius:1px;background:#FF5A36;opacity:.85;height:2px;
         transition:height .09s linear}
#odinLine{text-align:center;font-size:10px;letter-spacing:.06em;color:#F0883E;padding:2px 0 4px}
/* the arm button: off -> ODIN (amber) -> ALICE (violet), one message only */
#arm{transition:color .15s,border-color .15s,background .15s}
#arm[data-t="odin"]{color:#F0883E;border-color:#F0883E;background:rgba(240,136,62,.12)}
#arm[data-t="alice"]{color:#c07fe8;border-color:#c07fe8;background:rgba(192,127,232,.12)}
.ens{font-size:11px;color:#5d7182;margin-left:auto;text-align:right}
#bar{display:flex;gap:12px;font-size:10.5px;color:#4a5c6b;padding:2px 4px 0}
#bar b{color:#7b93a5;font-weight:600}

/* ── TRANSCRIPT ─────────────────────────────────────────────────────────── */
#feed{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;padding:12px 12px 90px}
.turn{margin:0 0 16px}
.who{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#4a5c6b;margin-bottom:4px}
.turn.you .who{color:#6b7f45}
.turn.odin .who{color:#3f93a3}
.turn.alice .who{color:#a3679a}
.bub{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.turn.you .bub{color:#9fb0bd}
pre{background:#0b1015;border:1px solid #16202a;border-radius:8px;padding:9px 10px;
    overflow-x:auto;font-size:12.5px;margin:8px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
.tools{margin-top:6px;padding:6px 8px;border-left:2px solid #1d2a35;color:#546a7a;font-size:11.5px}
.acts{margin-top:7px;display:flex;gap:8px;align-items:center}
.sbtn{font-size:11px;letter-spacing:.08em;color:#5d7182;background:#0b1015;border:1px solid #1b2732;
      border-radius:999px;padding:4px 12px;cursor:pointer}
.sbtn:active{background:#121a22}
.sbtn[data-play="1"]{color:#4fd0e3;border-color:#2f7d8c}
.err{color:#c26b6b;font-size:12.5px}

/* ── COUNCIL ────────────────────────────────────────────────────────────── */
#cfab{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:30;
      width:46px;height:46px;border-radius:50%;border:1px solid #3a2f5c;background:#120f1e;
      color:#9d8cd9;font-size:10px;letter-spacing:.06em;display:flex;align-items:center;
      justify-content:center;cursor:pointer;box-shadow:0 4px 16px #0009}
#cfab:active{background:#1a1530}
#cfab[data-busy="1"]{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #9d8cd922}}
#csheet, #asheet{position:fixed;inset:auto 0 0 0;z-index:40;max-height:78vh;overflow-y:auto;
        background:#0a0d13;border-top:1px solid #2a2340;border-radius:14px 14px 0 0;
        padding:12px 14px calc(20px + env(safe-area-inset-bottom));transform:translateY(101%);
        transition:transform .22s ease;box-shadow:0 -8px 30px #000a}
#csheet[data-open="1"], #asheet[data-open="1"]{transform:translateY(0)}
#csheet h3{margin:0 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9d8cd9}
.seat{border-top:1px solid #16202a;padding:9px 0}
.seat .sn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7b6bb5}
.seat .sr{font-size:10px;color:#4a5c6b;margin-left:6px;text-transform:none;letter-spacing:0}
.seat .st{font-size:13px;color:#a8b8c5;white-space:pre-wrap;margin-top:4px}
.seat[data-w="1"] .st{color:#3f4d59;font-style:italic}
#cclose{float:right;color:#5d7182;font-size:16px;padding:0 6px;cursor:pointer;margin-top:-4px}
.a-opt{display:flex;align-items:center;gap:12px;padding:16px 14px;font-size:16px;
       border-bottom:1px solid #16202a;color:#c8d4dd;cursor:pointer;font-weight:500}
.a-opt:active{background:#0d151b}
.a-opt:last-of-type{border-bottom:none}
.a-cancel{text-align:center;padding:16px 0 0;font-size:14px;color:#5d7182;cursor:pointer;font-weight:600}
.recover-ui{color:#5d7182;font-style:italic;animation:pulse 1.5s infinite}

/* ── KEYBOARD LIFT ──
   Android Chrome's default (interactive-widget=resizes-visual) shrinks only the VISUAL
   viewport when the soft keyboard opens, so `position:fixed;bottom:0` stays anchored
   BEHIND the keyboard — the composer, and whatever you were typing, becomes invisible.
   The viewport meta above asks for resizes-content, which fixes it on Chrome 108+.
   --kb is the belt-and-braces fallback: on browsers that ignore resizes-content it
   measures the leftover gap from visualViewport and lifts the pinned row by it.
   When resizes-content IS honoured this computes to ~0, so the two never fight. */
:root{--kb:0px}
#comp,#atts,#note,#cfab{transform:translateY(calc(-1 * var(--kb)));
      transition:transform .12s ease-out;will-change:transform}

/* ── COMPOSER (pinned bottom) ───────────────────────────────────────────── */
#comp{flex:0 0 auto;position:fixed;left:0;right:0;bottom:0;z-index:20;
      display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      background:linear-gradient(#07090cdd,#07090c 22%);border-top:1px solid #16202a}
#txt{flex:1 1 auto;resize:none;max-height:120px;min-height:40px;
     background:#0b1015;border:1px solid #1b2732;border-radius:12px;padding:10px 12px;
     color:#c8d4dd;font:15px/1.4 inherit;outline:none}
#txt:focus{border-color:#2f7d8c}
.rnd{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid #1b2732;
     background:#0b1015;color:#7b93a5;font-size:16px;display:flex;align-items:center;
     justify-content:center;cursor:pointer;user-select:none}
#mic[data-rec="1"]{background:#3a1414;border-color:#c26b6b;color:#ff9c9c;animation:pulse2 .9s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 7px #c26b6b33}}
#send{color:#4fd0e3;border-color:#2f7d8c}
#clip{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid #1b2732;
      background:#0b1015;color:#7b93a5;font-size:17px;display:flex;align-items:center;
      justify-content:center;cursor:pointer;user-select:none}
#clip[data-n]:not([data-n="0"]){color:#4fd0e3;border-color:#2f7d8c}
#atts{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:24;
      display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}
#atts:empty{display:none}
.att{display:flex;align-items:center;gap:6px;max-width:70%;background:#0d1620;
     border:1px solid #23384a;border-radius:10px;padding:4px 8px;font-size:11px;color:#9fb4c4}
.att b{font-weight:500;color:#c8d4dd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.att i{font-style:normal;color:#5d7182}
.att .x{color:#c26b6b;cursor:pointer;padding:0 2px}
#note{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:25;
      text-align:center;font-size:11px;color:#5d7182;pointer-events:none}
</style>
</head>
<body>

<div id="stack">
  <div id="ent" role="button" tabindex="0" aria-label="Helix — tap to mute or unmute">
    <svg id="orb" width="118" height="118" viewBox="0 0 150 150" aria-hidden="true">
      <circle cx="75" cy="75" r="68" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1"></circle>
      <circle cx="75" cy="75" r="55" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1"></circle>
      <circle id="oArc1" cx="75" cy="75" r="68" fill="none" stroke="#FF5A36" stroke-opacity=".85"
              stroke-width="2" stroke-linecap="round" stroke-dasharray="74 354" transform="rotate(-108 75 75)"></circle>
      <circle id="oArc2" cx="75" cy="75" r="55" fill="none" stroke="#FF5A36" stroke-opacity=".35"
              stroke-width="1.5" stroke-linecap="round" stroke-dasharray="30 316" transform="rotate(64 75 75)"></circle>
      <circle id="oCore" cx="75" cy="75" r="30" fill="#0d1218" stroke="#FF5A36" stroke-opacity=".5" stroke-width="1"></circle>
      <circle id="oDot" cx="75" cy="75" r="7" fill="#FF5A36"></circle>
    </svg>
    <div id="eBars" aria-hidden="true"></div>
    <div id="eName">HELIX</div>
    <div id="eState" class="mono">ready</div>
  </div>
  <div id="odinLine" class="mono" hidden></div>
  <div id="bar" class="mono">
    <span>cpu <b id="mCpu">–</b></span>
    <span>mem <b id="mMem">–</b></span>
    <span>facts <b id="mFacts">–</b></span>
    <span id="mBusy"></span>
  </div>
</div>

<div id="feed"></div>

<button id="cfab" title="Council">COUN<br>CIL</button>
<div id="csheet">
  <span id="cclose">✕</span>
  <h3>Council</h3>
  <div id="cbody"></div>
</div>
<div id="asheet">
  <div class="a-opt" id="aOptCam">📷 Take a photo</div>
  <div class="a-opt" id="aOptFile">📁 Pick files</div>
  <div class="a-cancel" id="aOptCancel">Cancel</div>
</div>

<div id="note"></div>
<div id="atts"></div>
<input id="fPick" type="file" multiple hidden>
<input id="fCam"  type="file" accept="image/*" capture="environment" hidden>
<div id="comp">
  <div class="rnd" id="clip" data-n="0">📎</div>
  <div class="rnd" id="mic">🎙</div>
  <div class="rnd" id="arm" data-t="helix" title="Send the next message straight to Odin">➜</div>
  <textarea id="txt" rows="1" placeholder="Speak or type to Helix…" enterkeyhint="send"></textarea>
  <div class="rnd" id="send">➜</div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const feed = $("feed");
let target = "helix";         // helix (default) | odin | alice — one message at a time
let busy = false;
let audioEl = null;           // one <audio>, reused — iOS/Android unlock it on first tap
let pendingEl = null;         // the reply bubble of the turn currently running (for reconnect repaint)
let recovering = false;       // guard: only one reconnect poller at a time

/* ── entity selection ─────────────────────────────────────────────────── */
/* Helix is the default and the face. The arm button bypasses him for exactly ONE
   message — a persistent mode you forget you are in means Opus answers small talk
   all evening, so it always snaps back after a send. */
const TONE = { helix:"#FF5A36", odin:"#F0883E", alice:"#c07fe8" };
function setTarget(t){
  target = t;
  $("arm").dataset.t = t;
  const ph = { helix:"Speak or type to Helix…", odin:"Straight to Odin…", alice:"Straight to Alice…" };
  $("txt").placeholder = ph[t] || ph.helix;
  $("eName").textContent = (t === "helix") ? "HELIX" : t.toUpperCase();
  paintOrb();
}
$("arm").onclick = () => setTarget(target === "helix" ? "odin" : (target === "odin" ? "alice" : "helix"));

/* MUTE lives on the orb. Remembered, because a phone in a pocket that suddenly
   talks is worse than one that stays quiet. */
let muted = (localStorage.getItem("helix_m_mute") === "1");
function setMuted(m){
  muted = m;
  localStorage.setItem("helix_m_mute", m ? "1" : "0");
  $("ent").dataset.muted = m ? "1" : "0";
  if (m) stopAudio();
  setState(m ? "muted" : "ready");
}
$("ent").onclick = () => setMuted(!muted);

/* The orb is the only status display: its colour says where the next message goes,
   its label says what Helix is doing. */
let entState = "ready";
function setState(s){ entState = s; $("eState").textContent = s; paintOrb(); }
function paintOrb(){
  const c = TONE[target] || TONE.helix;
  for (const id of ["oArc1","oArc2","oCore","oDot"]){
    const el = $(id); if (el) el.setAttribute("stroke", c);
  }
  const dot = $("oDot"); if (dot) dot.setAttribute("fill", c);
  const core = $("oCore"); if (core) core.setAttribute("fill", "#0d1218");
  const speaking = (entState === "speaking");
  const a1 = $("oArc1"), a2 = $("oArc2");
  if (a1) a1.setAttribute("stroke-dasharray", speaking ? "190 238" : "74 354");
  if (a2) a2.setAttribute("stroke-dasharray", speaking ? "120 226" : "30 316");
  if (dot) dot.setAttribute("r", speaking ? "11" : "7");
}

/* The envelope the audio events already carry, drawn under the orb. */
const BARS = 24;
(function(){ const b = $("eBars"); for (let i=0;i<BARS;i++) b.appendChild(document.createElement("i")); })();
function drawEnv(env){
  const bars = $("eBars").children;
  for (let i=0;i<BARS;i++){
    const v = (env && env.length) ? env[Math.floor(i * env.length / BARS)] : 0;
    bars[i].style.height = Math.max(2, Math.round((v || 0) * 16)) + "px";
  }
}
function clearEnv(){ drawEnv(null); }

/* ── markdown-lite: fenced code + inline code only ────────────────────── */
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function render(t){
  const parts = String(t).split(/```/);
  return parts.map((p,i) => i % 2
    ? "<pre><code>" + esc(p.replace(/^[a-zA-Z0-9]*\n/, "")) + "</code></pre>"
    : esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>")
  ).join("");
}

/* ── turns ────────────────────────────────────────────────────────────── */
function addTurn(who, text){
  const d = document.createElement("div");
  d.className = "turn " + who;
  d.innerHTML = '<div class="who">' + (who === "you" ? "You" : who.toUpperCase()) + '</div>'
              + '<div class="bub"></div>';
  d.querySelector(".bub").innerHTML = render(text || "");
  feed.appendChild(d);
  scroll();
  return d;
}
function scroll(){ feed.scrollTop = feed.scrollHeight; }
function nearBottom(){ return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120; }

/* ── the ▶ speak button: TEXT FIRST, audio only if asked ──────────────── */
function addSpeak(turnEl, text, who){
  if (!text || !text.trim()) return;
  const acts = document.createElement("div");
  acts.className = "acts";
  const b = document.createElement("button");
  b.className = "sbtn";
  b.textContent = "▶ speak";
  b.onclick = () => speak(b, text, who);
  acts.appendChild(b);
  turnEl.appendChild(acts);
}

async function speak(btn, text, who){
  if (btn.dataset.play === "1"){ stopAudio(); btn.dataset.play = ""; btn.textContent = "▶ speak"; return; }
  btn.dataset.play = "1"; btn.textContent = "◼ synthesising…";
  const queue = []; let playing = false;
  function next(){
    if (!queue.length){ playing = false; if (btn.dataset.play === "1"){ btn.dataset.play=""; btn.textContent="▶ speak"; } return; }
    playing = true;
    const url = queue.shift();
    if (!audioEl){ audioEl = new Audio(); audioEl.preload = "auto"; }
    audioEl.src = url;
    audioEl.onended = next;
    audioEl.onerror = next;
    audioEl.play().catch(() => next());
    btn.textContent = "◼ stop";
  }
  try{
    await sse("/speak", {text, who}, ev => {
      if (ev.event === "audio"){ queue.push(ev.data.url); if (!playing) next(); }
    });
    if (!playing && !queue.length){ btn.dataset.play=""; btn.textContent="▶ speak"; }
  }catch(e){
    btn.dataset.play = ""; btn.textContent = "▶ speak (failed)";
  }
}
function stopAudio(){
  liveQ.length = 0; livePlaying = false;
  if (audioEl){ audioEl.pause(); audioEl.onended = null; audioEl.src = ""; }
  clearEnv(); if (entState === "speaking") setState("ready");
}

/* Auto-speak for the live turn. One queue and one <audio> element, reused — mobile
   browsers only unlock playback on a real tap, so a second element would be silent.
   Each clip carries its RMS envelope, which is what drives the orb. */
const liveQ = []; let livePlaying = false;
function liveEnqueue(clip){
  if (muted || !clip || !clip.url) return;
  liveQ.push(clip);
  if (!livePlaying) liveNext();
}
/* A background report never goes through /ask_stream, so nothing synthesized it.
   Ask /speak and feed the SAME queue, so MUTE and the orb behave identically. */
async function speakNow(text){
  if (muted || !text || !text.trim()) return;
  try{
    await sse("/speak", {text, who: "odin"}, ev => {
      if (ev.event === "audio") liveEnqueue({url: ev.data.url, env: ev.data.env || [], dur: ev.data.dur || 0});
    });
  }catch(e){}
}

function liveNext(){
  const c = liveQ.shift();
  if (!c){ livePlaying = false; clearEnv(); if (entState === "speaking") setState("ready"); return; }
  livePlaying = true;
  setState("speaking"); drawEnv(c.env);
  if (!audioEl){ audioEl = new Audio(); audioEl.preload = "auto"; }
  audioEl.src = c.url;
  audioEl.onended = liveNext;
  audioEl.onerror = liveNext;
  audioEl.play().catch(() => {
    // Refused (no gesture yet, or the tab is backgrounded). Put it back and stand down
    // rather than wedging the queue — the next tap resumes it.
    liveQ.unshift(c); livePlaying = false; clearEnv();
    setState("tap the orb to allow sound");
  });
}

/* ── SSE over POST (EventSource can't POST) ───────────────────────────── */
async function sse(url, body, onEvent){
  const r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while (true){
    const {value, done} = await rd.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0){
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      let name = "message", data = "";
      for (const line of raw.split("\n")){
        if (line.startsWith("event:")) name = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      let parsed = {};
      try { parsed = data ? JSON.parse(data) : {}; } catch(e){ parsed = {text:data}; }
      onEvent({event:name, data:parsed});
    }
  }
}

/* ── ask ──────────────────────────────────────────────────────────────── */
async function ask(text){
  if (busy || !text.trim()) return;
  busy = true; $("send").style.opacity = ".4";
  addTurn("you", text);
  const who = target;
  setTarget("helix");            // the bypass is spent by exactly one message
  setState("thinking");
  const el = addTurn(who === "helix" ? "odin" : who, "");
  const bub = el.querySelector(".bub");
  pendingEl = el;                         // so a reconnect knows which bubble to repaint
  let acc = "", final = "", done = false;
  try{
    await sse("/ask_stream", {text, mode: who, voice: !muted}, ev => {
      const d = ev.data || {};
      if (ev.event === "audio"){
        liveEnqueue({url: d.url, env: d.env || [], dur: d.dur || 0});
      } else if (ev.event === "turn"){
        // Remember the running turn; if the screen sleeps and this stream dies, we recover it.
        localStorage.setItem("hx_turn", JSON.stringify({id: d.id || "", q: text, who}));
      } else if (ev.event === "text"){
        acc += (d.text || "");
        bub.innerHTML = render(acc);
        if (nearBottom()) scroll();
      } else if (ev.event === "final"){
        final = d.text || acc;
        bub.innerHTML = render(final);
      } else if (ev.event === "done"){
        done = true;
      } else if (ev.event === "tool"){
        // tool activity, shown quietly
      } else if (ev.event === "error"){
        const e = document.createElement("div");
        e.className = "err"; e.textContent = d.text || JSON.stringify(d);
        el.appendChild(e);
      }
    });
    // Stream ended normally (saw 'done'): turn is settled, nothing to recover.
    localStorage.removeItem("hx_turn"); pendingEl = null;
    addSpeak(el, final || acc, who);
  }catch(e){
    // Connection dropped (typically the screen went dark). The turn is still running on the
    // PC and writing to its durable buffer — don't show a hard error; let the reconnect
    // poller pick it back up. Only surface an error if there was nothing to recover.
    if (!localStorage.getItem("hx_turn")){
      const er = document.createElement("div");
      er.className = "err"; er.textContent = "connection lost: " + e.message;
      el.appendChild(er);
    } else {
      const bub = el.querySelector(".bub");
      if(bub && !bub.querySelector(".recover-ui")) {
        bub.innerHTML += '<div class="recover-ui">Recovering…</div>';
      }
      recoverTurn();                      // try immediately; visibility handler also retries
    }
  }
  busy = false; $("send").style.opacity = "1"; scroll();
  if (entState === "thinking") setState(muted ? "muted" : "ready");
}

/* ── reconnect: recover a turn that finished (or is still running) while the
   screen was dark. Polls /turn_state and repaints the pending bubble. ───────── */
function loadPending(){
  try{ return JSON.parse(localStorage.getItem("hx_turn") || "null"); }
  catch(e){ return null; }
}
async function recoverTurn(){
  const rec = loadPending();
  if (!rec || !rec.id || recovering) return;
  recovering = true;
  try{
    // Fresh page load (no live bubble in the DOM): probe once. If the turn already finished
    // it's in server history and loadHistory() shows it — just clear and stop. If it's still
    // running, build the bubbles and follow it to completion.
    if (!pendingEl){
      let s0;
      try{ s0 = await (await fetch("/turn_state?id=" + encodeURIComponent(rec.id))).json(); }
      catch(e){ recovering = false; return; }          // offline; a later trigger retries
      if (!s0.found || s0.done){ localStorage.removeItem("hx_turn"); recovering = false; return; }
      addTurn("you", rec.q || "");
      pendingEl = addTurn(rec.who || "odin", "");
      pendingEl.querySelector(".bub").innerHTML = '<div class="recover-ui">Recovering…</div>';
      busy = true; $("send").style.opacity = ".4";
    }
    while (true){
      const cur = loadPending();
      if (!cur || cur.id !== rec.id) break;            // turn changed/cleared under us
      let s;
      try{ s = await (await fetch("/turn_state?id=" + encodeURIComponent(rec.id))).json(); }
      catch(e){ await sleep(1500); continue; }         // still offline — keep trying
      if (!s.found){ localStorage.removeItem("hx_turn"); break; }   // aged out of the ring
      if (pendingEl){
        pendingEl.querySelector(".bub").innerHTML = render(s.text || "");
        if (nearBottom()) scroll();
      }
      if (s.done){
        localStorage.removeItem("hx_turn");
        if (pendingEl){ addSpeak(pendingEl, s.text || "", rec.who || "odin"); pendingEl = null; }
        busy = false; $("send").style.opacity = "1";
        break;
      }
      await sleep(1200);                               // still running — poll on
    }
  } finally { recovering = false; }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* When the screen wakes or the tab regains focus, try to recover any turn that was
   in flight when it slept. This is what makes the phone survive a dark screen. */
document.addEventListener("visibilitychange", () => { if (!document.hidden) recoverTurn(); });
window.addEventListener("pageshow", recoverTurn);
window.addEventListener("online", recoverTurn);

/* ── composer ─────────────────────────────────────────────────────────── */
const txt = $("txt");
txt.addEventListener("input", () => {
  txt.style.height = "auto";
  txt.style.height = Math.min(120, txt.scrollHeight) + "px";
});

/* ── keyboard occlusion fix ─────────────────────────────────────────────
   Measure the gap the soft keyboard leaves between the layout viewport and the
   visual viewport, and lift the pinned composer row by exactly that much. On a
   browser honouring interactive-widget=resizes-content this is ~0 and nothing
   moves; on one that isn't, this is what keeps the text you're typing on screen.
   Also re-pins the feed to the bottom so the last reply isn't pushed out of view. */
const vv = window.visualViewport;
if (vv){
  const stick = () => {
    const gap = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", gap + "px");
  };
  const stickAndScroll = () => {
    stick();
    // let layout settle before measuring scrollHeight
    requestAnimationFrame(() => { const f = $("feed"); if (f) f.scrollTop = f.scrollHeight; });
  };
  vv.addEventListener("resize", stickAndScroll);
  vv.addEventListener("scroll", stick);
  txt.addEventListener("focus", () => setTimeout(stickAndScroll, 250));
  txt.addEventListener("blur",  () => setTimeout(stick, 100));
  stick();
}
// Growing the box past one line must also keep the caret visible.
txt.addEventListener("input", () => {
  const f = $("feed"); if (f) f.scrollTop = f.scrollHeight;
});
async function submit(){
  let v = txt.value.trim();
  if (!v && !atts.length) return;
  txt.value = ""; txt.style.height = "auto";
  if (atts.length){
    try{
      const saved = await uploadAtts();
      const lines = saved.map(f => "- " + f.path + "  (" + f.type + ", " + human(f.bytes) + ")").join("\n");
      v = (v || "I sent you these files.") +
          "\n\n[attached, already saved in my workspace inbox — open them with your file tools:\n" +
          lines + "\n]";
    }catch(e){
      note("upload failed — " + e.message); setTimeout(()=>note(""),3000); return;
    }
  }
  ask(v);
}
$("send").onclick = submit;

/* ── ATTACHMENTS: file + camera ────────────────────────────────── */
/* An attachment is not pasted into the model's context. It is uploaded into ODIN's workspace
   inbox and the message carries the PATHS, so he opens it with his real tools. A photographed
   document therefore stays on disk to be read, OCR'd or archived. */
let atts = [];                       // {file, name, bytes}
const clip = $("clip");

function human(b){ return b >= 1048576 ? (b/1048576).toFixed(1)+" MB"
                 : b >= 1024 ? Math.round(b/1024)+" KB" : b+" B"; }

function paintAtts(){
  const box = $("atts");
  box.innerHTML = "";
  atts.forEach((a, i) => {
    const d = document.createElement("div");
    d.className = "att";
    const b = document.createElement("b"); b.textContent = a.name;
    const t = document.createElement("i"); t.textContent = human(a.bytes);
    const x = document.createElement("span"); x.className = "x"; x.textContent = "✕";
    x.onclick = () => { atts.splice(i,1); paintAtts(); };
    d.appendChild(b); d.appendChild(t); d.appendChild(x);
    box.appendChild(d);
  });
  if (atts.length > 1){
    const c = document.createElement("div");
    c.className = "att"; c.id = "attClear";
    const b = document.createElement("b"); b.textContent = "clear all";
    const x = document.createElement("span"); x.className = "x"; x.textContent = "✕";
    c.appendChild(b); c.appendChild(x);
    c.onclick = () => { atts = []; paintAtts(); };
    box.appendChild(c);
  }
  clip.dataset.n = String(atts.length);
}

function addFiles(list){
  for (const f of list) atts.push({file:f, name:f.name || "photo.jpg", bytes:f.size});
  paintAtts();
}
$("fPick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("fCam").onchange  = e => { addFiles(e.target.files); e.target.value = ""; };

/* One tap = choose, and it ALWAYS ADDS. Tapping with files already queued used to WIPE them,
   which made a second document impossible to attach. Removing a file is the chip's own ✕;
   removing all of them is the "clear all" chip. */
const asheet = $("asheet");
clip.onclick = () => { asheet.dataset.open = "1"; };
$("aOptCam").onclick = () => { asheet.dataset.open = ""; $("fCam").click(); };
$("aOptFile").onclick = () => { asheet.dataset.open = ""; $("fPick").click(); };
$("aOptCancel").onclick = () => { asheet.dataset.open = ""; };

async function uploadAtts(){
  if (!atts.length) return null;
  const fd = new FormData();
  atts.forEach(a => fd.append("files", a.file, a.name));
  note("uploading " + atts.length + " file" + (atts.length>1?"s":"") + "…");
  const r = await fetch("/upload", {method:"POST", body: fd});
  const j = await r.json();
  if (!r.ok || !j.saved) throw new Error(j.error || "upload failed");
  atts = []; paintAtts(); note("");
  return j.saved;
}
txt.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submit(); }
});

/* ── HOLD TO TALK ─────────────────────────────────────────────────────── */
const mic = $("mic");
let rec = null, chunks = [], recStop = null;

function note(s){ $("note").textContent = s || ""; }

async function startRec(){
  if (rec) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true, autoGainControl:true
    }});
    let mime = "";
    for (const m of ["audio/webm;codecs=opus","audio/webm","audio/mp4"]){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime = m; break; }
    }
    rec = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"});
      rec = null;
      mic.dataset.rec = "";
      if (blob.size < 1500){ note(""); return; }
      note("transcribing…");
      const fd = new FormData();
      fd.append("audio", blob, "clip.webm");
      try{
        const r = await fetch("/listen/phone", {method:"POST", body: fd});
        const j = await r.json();
        note("");
        if (j.text){ txt.value = j.text; txt.dispatchEvent(new Event("input")); submit(); }
        else note(j.error ? ("heard nothing — " + j.error) : "heard nothing");
        setTimeout(() => note(""), 2200);
      }catch(e){ note("transcription failed"); setTimeout(() => note(""), 2200); }
    };
    rec.start();
    mic.dataset.rec = "1";
    note("listening… release to send");
    // hard cap so a stuck finger can't record forever
    recStop = setTimeout(() => stopRec(), 60000);
  }catch(e){
    note("microphone blocked — needs HTTPS");
    setTimeout(() => note(""), 3000);
  }
}
function stopRec(){
  if (recStop){ clearTimeout(recStop); recStop = null; }
  if (rec && rec.state !== "inactive") rec.stop();
  note("");
}
mic.addEventListener("pointerdown", e => { e.preventDefault(); startRec(); });
mic.addEventListener("pointerup",   e => { e.preventDefault(); stopRec();  });
mic.addEventListener("pointercancel", () => stopRec());
mic.addEventListener("pointerleave", () => { if (rec) stopRec(); });

/* ── COUNCIL ──────────────────────────────────────────────────────────── */
const sheet = $("csheet"), cbody = $("cbody");
$("cclose").onclick = () => sheet.dataset.open = "";
$("cfab").onclick = async () => {
  if (sheet.dataset.open === "1"){ sheet.dataset.open = ""; return; }
  sheet.dataset.open = "1";
  if ($("cfab").dataset.busy === "1") return;
  $("cfab").dataset.busy = "1";
  cbody.innerHTML = "";
  const seats = {};
  const last = [...feed.querySelectorAll(".turn.you .bub")].pop();
  const q = last ? last.textContent : "";
  try{
    await sse("/council_stream", {text: q}, ev => {
      const d = ev.data || {};
      if (ev.event === "seat_start"){
        const el = document.createElement("div");
        el.className = "seat"; el.dataset.w = "1";
        el.innerHTML = '<div class="sn">' + esc(d.seat) + '<span class="sr">' + esc(d.role||"") + '</span></div>'
                     + '<div class="st">thinking…</div>';
        seats[d.seat] = el; cbody.appendChild(el);
      } else if (ev.event === "seat_done"){
        const el = seats[d.seat]; if (!el) return;
        el.dataset.w = "";
        el.querySelector(".st").innerHTML = render(d.text || "");
        el.querySelector(".sn").innerHTML += ' <span class="sr">' + Math.round((d.ms||0)/100)/10 + 's</span>';
      }
    });
  }catch(e){
    cbody.innerHTML += '<div class="err">council failed: ' + esc(e.message) + '</div>';
  }
  $("cfab").dataset.busy = "";
};

/* ── telemetry + history ──────────────────────────────────────────────── */
/* proactive reports: turns Odin started on his own (a background job finished).
   The backend announces them in /stat; unseen ids resolve via /turn_state to a bubble. */
let noteSeq = null; const noteKnown = new Set();
function odinLine(s){
  const el = $("odinLine");
  if (!el) return;
  if (typeof s.work_busy !== "boolean"){ el.hidden = true; return; }   // older app.py
  const bits = [];
  if (s.work_busy) bits.push("ODIN WORKING");
  if (s.notes) bits.push(s.notes + (s.notes === 1 ? " NOTE WAITING" : " NOTES WAITING"));
  el.textContent = bits.join("  ·  ");
  el.hidden = bits.length === 0;
}

function noteCheck(s){
  if (typeof s.note_seq !== "number") return;
  if (noteSeq === null){ noteSeq = s.note_seq; (s.note_ids||[]).forEach(id => noteKnown.add(id)); return; }
  if (s.note_seq === noteSeq) return;
  noteSeq = s.note_seq;
  (s.note_ids||[]).forEach(async id => {
    if (noteKnown.has(id)) return; noteKnown.add(id);
    try{
      const t = await (await fetch("/turn_state?id=" + encodeURIComponent(id))).json();
      if (t.found && t.text){
        const el = addTurn("odin", t.text); addSpeak(el, t.text, "odin");
        speakNow(t.text);          // a job landing is the thing you most want spoken
      }
    }catch(e){}
  });
}
async function poll(){
  try{
    const s = await (await fetch("/stat")).json();
    $("mCpu").textContent   = (s.cpu ?? "–") + "%";
    $("mMem").textContent   = s.mem_used ? Math.round(s.mem_used/1024) + "G" : (s.mem ?? "–");
    $("mFacts").textContent = s.facts ?? "–";
    $("mBusy").textContent  = s.turn_busy ? "· thinking" : "";
    // (the old two-row status moved onto the orb — see setState/odinLine)
    noteCheck(s);
    odinLine(s);
  }catch(e){}
}
async function loadHistory(){
  try{
    const h = await (await fetch("/history")).json();
    for (const t of (h.turns || [])){
      const el = addTurn(t.role, t.text);
      if (t.role !== "you") addSpeak(el, t.text, t.role);
    }
    scroll();
  }catch(e){}
}
/* boot: Helix is the face, the orb carries the remembered mute, nothing is armed */
setTarget("helix");
setMuted(muted);
loadHistory().then(recoverTurn);      // recover an in-flight turn after prior history is drawn
poll();
setInterval(poll, 5000);
</script>
